<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compre Desk</title>
<meta name="description" content="Relative-grading tracker, compre planner and study desk for BITS students. Your data stays in your browser.">
<meta name="theme-color" content="#fff6df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1740" media="(prefers-color-scheme: dark)">
<script>/* apply a saved Day/Night choice before first paint (no flash) */(function(){try{var t=localStorage.getItem('compre-desk:theme');if(t==='light'||t==='dark'){var r=document.documentElement;r.setAttribute('data-theme',t);var m=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<m.length;i++)m[i].setAttribute('content',t==='dark'?'#1c1740':'#fff6df');}}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2.1.0">
</head>
<body>
<a class="vh" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap toprow">
    <a class="brand" href="#home"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="14" cy="16" r="10.5" fill="#d62839" stroke="currentColor" stroke-width="2.5"/><polygon points="27,6 37.5,26 16.5,26" fill="#ffd23f" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M4 35q4.5-5 9 0t9 0t9 0t7 0" fill="none" stroke="#1fa584" stroke-width="3.2" stroke-linecap="round"/></svg>Compre Desk</a>
    <nav class="tabs tabs-top" aria-label="Main">
      <a href="#home" data-r="home">Overview</a>
      <a href="#planner" data-r="planner">Planner</a>
      <a href="#calendar" data-r="calendar">Calendar</a>
      <a href="#notes" data-r="notes">Notes</a>
      <a href="#deadlines" data-r="deadlines">Deadlines</a>
      <a href="#data" data-r="data">Backup &amp; data</a>
    </nav>
    <a class="status" id="status" href="#data" data-state="saving" aria-live="polite">Loading…</a>
    <button class="themetog" type="button" data-theme-toggle aria-label="Switch theme" data-tip="Switch theme">
      <svg class="ti sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.6" fill="currentColor" stroke="currentColor" stroke-width="1.6"/><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <svg class="ti moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path class="star" d="M18 3.2l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<div class="savebar" id="savebar" hidden role="alert"><div class="wrap"><span></span><button class="ghost sm">Retry now</button></div></div>
<nav class="wrap" aria-label="Subjects"><div class="subs" id="subs"></div></nav>
<main id="main" tabindex="-1"><div class="loading" role="status">Loading…</div></main>
<nav class="bnav" aria-label="Main (mobile)">
  <a href="#home" data-r="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Overview</a>
  <a href="#planner" data-r="planner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5zM9 9l2 2 4-4M9 15h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Planner</a>
  <a href="#calendar" data-r="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v15H4zM4 10h16M8 3v5M16 3v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Calendar</a>
  <a href="#notes" data-r="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Notes</a>
  <a href="#deadlines" data-r="deadlines"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Deadlines</a>
</nav>
<div id="toast" aria-live="polite"></div>
<div id="modal" hidden></div>
<noscript><div class="wrap"><div class="banner">Compre Desk needs JavaScript.</div></div></noscript>
<script type="module" src="js/theme.js?v=2.1.0"></script>
<script type="module" src="js/app.js?v=2.1.0"></script>
</body>
</html>
